[workspace]

members = [
    "bemodel", "climate", "hulc", "hulc2model", "hulc_tests", "convertdb"
]

[workspace.package]
version = "22.10.0"
authors = ["Rafael Villar Burke <pachi@ietcc.csic.es>"]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
clap = "4.6.0"
chrono = "0.4.44"
criterion = { version="0.4", features=["html_reports"] }
encoding = "0.2"
env_logger= "0.11.10"
exitcode = "1.1"
flate2 = "1.1.9"
glob = "0.3.3"
log = "0.4.29"
md5 = "0.8.0"
nalgebra = { version="0.34.2", features=["serde-serialize"] }
once_cell = "1.21.4"
regex = "1.12.3"
roxmltree = "0.21.1"
serde = { version="1.0", features=["derive"] }
serde_json = "1.0.149"
uneval="0.2"
uuid = { version="1.23", features=["serde","v4", "js"]}

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
incremental = false
opt-level = "z"
# Modificación para mejorar info de flamegraph
debug = true


[profile.bench]
debug = true
